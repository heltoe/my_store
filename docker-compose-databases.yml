services:
  account-db:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: account_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - account_db_data:/var/lib/postgresql/data

  product-db:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - product_db_data:/var/lib/postgresql/data

  cart-db:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cart_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - cart_db_data:/var/lib/postgresql/data

  order-db:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5436:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data

  payment-db:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5437:5432"
    volumes:
      - payment_db_data:/var/lib/postgresql/data

  courier-db:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: courier_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5438:5432"
    volumes:
      - courier_db_data:/var/lib/postgresql/data

  delivery-db:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: delivery_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5439:5432"
    volumes:
      - delivery_db_data:/var/lib/postgresql/data

volumes:
  account_db_data:
  product_db_data:
  cart_db_data:
  order_db_data:
  payment_db_data:
  courier_db_data:
  delivery_db_data:
